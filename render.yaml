services:
  - type: web
    name: ielts-backend
    runtime: python
    repo: https://github.com/Eric0417/ielts-practice
    branch: main
    buildCommand: "pip install -r backend/requirements.txt && cd backend && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ielts-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: POE_API_KEY
        sync: false
      - key: POE_MODEL
        value: gpt-5.4-nano
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: IELTS Practice <onboarding@resend.dev>
      - key: CORS_ORIGINS
        value: https://ielts-frontend.onrender.com

  - type: static
    name: ielts-frontend
    repo: https://github.com/Eric0417/ielts-practice
    branch: main
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ielts-backend.onrender.com

databases:
  - name: ielts-db
    plan: free
